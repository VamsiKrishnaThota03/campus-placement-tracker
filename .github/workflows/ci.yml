name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest web/test_app.py -v

  config-safety:
    # The app refuses to start without a SECRET_KEY unless FLASK_DEBUG is on,
    # and binds loopback by default. Both regress silently if nothing checks.
    name: refuses to run unconfigured
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Importing without SECRET_KEY raises, rather than using a default
        working-directory: web
        env:
          FLASK_DEBUG: '0'
          DATABASE_URL: 'sqlite://'
        run: |
          set +e
          output=$(python -c "import app" 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0 || { echo "::error::imported with no SECRET_KEY"; exit 1; }
          echo "$output" | grep -q "SECRET_KEY" \
            || { echo "::error::expected a SECRET_KEY error"; exit 1; }

      - name: Default bind is loopback, not all interfaces
        working-directory: web
        env:
          FLASK_DEBUG: '0'
          SECRET_KEY: ci-only-secret
          DATABASE_URL: 'sqlite:///ci.db'
          SESSION_COOKIE_SECURE: 'false'
        run: |
          set -euo pipefail
          python init_db.py || true
          python app.py & SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5001/ > /dev/null 2>&1 && break
            sleep 1
          done

          echo "--- listening sockets on 5001 ---"
          ss -ltn 2>/dev/null | grep ':5001' || true

          if ss -ltn 2>/dev/null | grep -qE '(0\.0\.0\.0|\*):5001'; then
            echo "::error::server is listening on all interfaces by default"
            exit 1
          fi
          ss -ltn 2>/dev/null | grep -q '127.0.0.1:5001' \
            || { echo "::error::no loopback listener found"; ss -ltn; exit 1; }

          # Security headers must be present on a real response, not just in tests.
          headers=$(curl -sS -D - -o /dev/null http://127.0.0.1:5001/)
          echo "$headers"
          for header in "Content-Security-Policy" "X-Content-Type-Options" \
                        "X-Frame-Options" "Referrer-Policy"; do
            echo "$headers" | grep -qi "$header" \
              || { echo "::error::$header missing from the live response"; exit 1; }
          done
          echo "loopback bind and security headers confirmed"

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: campus-placement-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
